<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NYC NTA Bus Need Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --panel: #13161e;
      --border: #1f2535;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--panel);
    }

    .header-left h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .header-left p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .status-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status-badge.loaded {
      border-color: #22c55e55;
      color: #22c55e;
      background: #22c55e11;
    }

    main { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; background: #0a0c10; }

    aside {
      width: 240px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend-bar {
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(to right, #4a0000, #ef4444, #ff0000);
      margin-bottom: 6px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--muted);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    #tooltip-panel { padding: 16px; flex: 1; }

    .tooltip-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }
    .tooltip-code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .tooltip-score-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .tooltip-score-val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #ef4444;
    }
    .tooltip-bar-wrap {
      margin-top: 10px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .tooltip-bar-fill {
      height: 100%;
      background: linear-gradient(to right, #fca5a5, #7f1d1d);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .tooltip-empty { font-size: 11px; color: var(--muted); line-height: 1.6; }

    .top-list { list-style: none; }
    .top-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
    }
    .top-list li:last-child { border-bottom: none; }
    .top-list .rank {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      width: 16px;
    }
    .top-list .nta-name { flex: 1; padding: 0 6px; color: var(--text); }
    .top-list .nta-score {
      font-family: 'IBM Plex Mono', monospace;
      color: #ef4444;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }
    .empty-icon { font-size: 28px; opacity: 0.3; }
    .empty-text { font-size: 11px; color: var(--muted); line-height: 1.6; }

    .leaflet-container { background: #0a0c10 !important; }
    .leaflet-tile-pane { filter: brightness(0.6) saturate(0.4) hue-rotate(200deg); }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 16px;
    }
    .loading-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading NTA boundaries...</div>
</div>

<header>
  <div class="header-left">

    <p>Neighborhood Tabulation Areas · 2020 Boundaries</p>
  </div>
  <span class="status-badge" id="data-status">Loading...</span>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div class="panel-section">

      </div>
    </div>

    <div class="panel-section" id="stats-panel">

      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-text">Loading...</div>
      </div>
    </div>

    <div class="panel-section" id="top-panel">
      <div class="panel-label">Top 10 Highest Need</div>
      <div class="empty-state">
        <div class="empty-icon">📍</div>
        <div class="empty-text">Loading...</div>
      </div>
    </div>

    <div id="tooltip-panel">
      <div class="panel-label">Selected NTA</div>
      <div id="hover-content">
        <div class="tooltip-empty">Hover over a neighborhood to see details.</div>

    </div>
  </aside>

  const scores = HARD_SCORES;

  function lerpColor(a, b, t) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
    const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
    const rr = Math.round(ar + (br - ar) * t);
    const rg = Math.round(ag + (bg - ag) * t);
    const rb = Math.round(ab + (bb - ab) * t);
    return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb).toString(16).slice(1);
  }

  const MIN_SCORE = 0.037;
  const MAX_SCORE = 0.823;

  function getColor(score) {
    if (score === null || score === undefined) return '#1e2033';
    const stops = ['#4a0000', '#ef4444', '#ff0000'];
    const t = (score - MIN_SCORE) / (MAX_SCORE - MIN_SCORE);
    const clamped = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    const i = Math.floor(clamped);
    const f = clamped - i;
    if (i >= stops.length - 1) return stops[stops.length - 1];
    return lerpColor(stops[i], stops[i + 1], f);
  }

  function getOpacity(score) {
    if (score === null || score === undefined) return 0.25;
    return 0.55 + score * 0.4;
  }

  function styleFeature(feature) {
    const code = feature.properties.NTA2020 || feature.properties.NTACode || feature.properties.ntacode;
    const score = scores[code] !== undefined ? scores[code] : null;
    return {
      fillColor: getColor(score),
      fillOpacity: getOpacity(score),
      color: '#ffffff',
      weight: 0.5,
      opacity: 0.25
    };
  }

  function onEachFeature(feature, layer) {
    layer.on({
      mouseover: function(e) {
        const lyr = e.target;
        lyr.setStyle({ weight: 1.5, color: '#ffffff', opacity: 0.7, fillOpacity: 0.95 });
        lyr.bringToFront();
        const props = feature.properties;
        const code = props.NTA2020 || props.NTACode || props.ntacode;
        const name = props.NTAName || props.ntaname || 'Unknown';
        updateHoverPanel(name, code, scores[code]);
      },
      mouseout: function(e) {
        geojsonLayer.resetStyle(e.target);
        resetHoverPanel();
      }
    });
  }

  function updateHoverPanel(name, code, score) {
    const content = document.getElementById('hover-content');
    if (score !== undefined) {
      const pct = Math.round(score * 100);
      content.innerHTML = `
        <div class="tooltip-name">${name}</div>
        <div class="tooltip-code">${code}</div>
        <div class="tooltip-score-label">Need Score</div>
        <div class="tooltip-score-val">${score.toFixed(3)}</div>
        <div class="tooltip-bar-wrap">
          <div class="tooltip-bar-fill" style="width:${pct}%"></div>
        </div>
      `;
    } else {
      content.innerHTML = `
        <div class="tooltip-name">${name}</div>
        <div class="tooltip-code">${code}</div>
        <div class="tooltip-empty" style="margin-top:12px">No score for this NTA.</div>
      `;
    }
  }

  function resetHoverPanel() {
    document.getElementById('hover-content').innerHTML =
      '<div class="tooltip-empty">Hover over a neighborhood to see details.</div>';
  }

  function updateStats() {
    const vals = Object.values(scores);
    const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
    const max = Math.max(...vals);
    const min = Math.min(...vals);
    const high = vals.filter(v => v >= 0.75).length;
    document.getElementById('stats-panel').innerHTML = `
      <div class="panel-label">Statistics</div>
      <div class="stat-row"><span class="stat-label">NTAs scored</span><span class="stat-val">${vals.length}</span></div>
      <div class="stat-row"><span class="stat-label">Mean score</span><span class="stat-val">${avg.toFixed(3)}</span></div>
      <div class="stat-row"><span class="stat-label">Max score</span><span class="stat-val">${max.toFixed(3)}</span></div>
      <div class="stat-row"><span class="stat-label">Min score</span><span class="stat-val">${min.toFixed(3)}</span></div>
      <div class="stat-row"><span class="stat-label">High need (≥0.75)</span><span class="stat-val" style="color:#ef4444">${high}</span></div>
    `;
  }

  function updateTopList() {
    if (!ntaData) return;
    const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]).slice(0, 10);
    const nameMap = {};
    ntaData.features.forEach(f => {
      const code = f.properties.NTA2020 || f.properties.NTACode || f.properties.ntacode;
      nameMap[code] = f.properties.NTAName || f.properties.ntaname || code;
    });
    const items = sorted.map(([code, score], i) => `
      <li>
        <span class="rank">${i+1}</span>
        <span class="nta-name">${nameMap[code] || code}</span>
        <span class="nta-score">${score.toFixed(2)}</span>
      </li>
    `).join('');
    document.getElementById('top-panel').innerHTML = `
      <div class="panel-label">Top 10 Highest Need</div>
      <ul class="top-list">${items}</ul>
    `;
  }

      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    try {
      const res = await fetch(NTA_GEOJSON_URL);
      if (!res.ok) throw new Error('Failed to fetch');
      ntaData = await res.json();

      geojsonLayer = L.geoJSON(ntaData, {
        style: styleFeature,
        onEachFeature: onEachFeature
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds());
      document.getElementById('loading').style.display = 'none';

      const count = Object.keys(scores).length;
      document.getElementById('data-status').textContent = `${count} NTAs scored`;
      document.getElementById('data-status').className = 'status-badge loaded';
      updateStats();
      updateTopList();

    } catch (err) {
      document.getElementById('loading').innerHTML = `
        <div style="text-align:center;padding:32px;max-width:400px">
          <div style="font-size:24px;margin-bottom:12px">⚠️</div>
          <div class="loading-text" style="color:#ef4444;margin-bottom:8px">Could not load NTA boundaries</div>
          <div class="loading-text" style="font-size:10px;line-height:1.8">
            Make sure nynta2020.geojson is in the same folder as this file.
          </div>
        </div>
      `;
    }
  }

  initMap();
</script>
</body>
</html>
